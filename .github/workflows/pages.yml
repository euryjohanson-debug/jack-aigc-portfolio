name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Validate website files
        run: node scripts/validate-site.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/github-script@v8
        with:
          script: |
            const args = {owner: context.repo.owner, repo: context.repo.repo};
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...args, run_id: context.runId});
            const artifact = data.artifacts.find(a => a.name === 'github-pages' && !a.expired);
            if (!artifact) throw new Error('The validated Pages artifact is unavailable');
            const oidc = await core.getIDToken();
            const deployment = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...args, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token: oidc
            });
            core.setOutput('page_url', deployment.data.page_url);
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data: status} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...args, deployment_id: deployment.data.id
              });
              if (status.status === 'succeed') {core.info('Pages deployment succeeded'); return;}
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'errored'].includes(status.status)) {
                throw new Error('Pages deployment failed: ' + status.status);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages deployment timed out');
